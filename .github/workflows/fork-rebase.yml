# 自动把 langfuse-patch 分支 rebase 到上游 Wei-Shaw/sub2api 最新 release tag 上。
#
# 触发：每日定时（UTC 02:00）+ 手动 workflow_dispatch。
# 成功 → 强推 langfuse-patch（触发 fork-release.yml 出镜像）。
# 失败（冲突）→ 开 issue 提醒手动解决。
#
# 前提：fork 仓库有一个长期分支 `langfuse-patch`，包含 langfuse 装饰器改动，
# 且该分支的改动相对上游是"纯新增/最小替换"，rebase 冲突概率极低。
name: fork-rebase

on:
  schedule:
    # 每日 UTC 02:00（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 强推分支需要
  issues: write   # 开冲突 issue 需要

env:
  UPSTREAM: "Wei-Shaw/sub2api"
  PATCH_BRANCH: "langfuse-patch"
  BASE_BRANCH: "main"

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (patch branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0 # 完整历史，rebase 需要
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          # 把上游 tags 拉到独立的 refs/upstream-tags/ 命名空间，避免与 fork
          # 上通过 `gh release create` 产生的同名 tag（指向 rebase 后的 commit）
          # 冲突而导致 `git fetch --tags` 报 "would clobber existing tag" 退出 1。
          # 参考事故：run 28568852559（上游 v0.1.139 与 fork v0.1.139 同名不同 commit）
          git fetch upstream --no-recurse-submodules --prune \
            '+refs/tags/*:refs/upstream-tags/*' \
            "${BASE_BRANCH}"

      - name: Resolve latest upstream tag
        id: latest
        run: |
          # 从独立命名空间取上游最新的稳定 release tag（按版本号排序）
          LATEST_REF=$(git for-each-ref --sort=-v:refname \
            --format='%(refname)' refs/upstream-tags/ | \
            grep -E 'refs/upstream-tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_REF" ]; then
            echo "::warning::No upstream version tags found"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG="${LATEST_REF#refs/upstream-tags/}"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$LATEST_REF" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $LATEST_TAG ($LATEST_REF)"

      - name: Check if already rebased
        id: check
        if: steps.latest.outputs.skip != 'true'
        run: |
          # 如果 patch 分支的 HEAD 已经包含该 tag 的提交，则跳过。
          # 注意：必须用 refs/upstream-tags/<tag>（上游那个 commit），
          # 而不是短名 <tag>（会解析到 fork 上同名 tag 指向的 rebase 后 commit，
          # 使 is-ancestor 恒为真、永远跳过 rebase）。
          if git merge-base --is-ancestor "${{ steps.latest.outputs.ref }}" HEAD; then
            echo "already on ${{ steps.latest.outputs.tag }}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase patch onto upstream tag
        id: rebase
        if: steps.check.outputs.skip != 'true'
        run: |
          set +e
          git rebase --onto "${{ steps.latest.outputs.ref }}" \
            "$(git merge-base HEAD upstream/${BASE_BRANCH} 2>/dev/null || echo HEAD~20)" \
            HEAD
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "rebase_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Rebase conflict detected"
            git rebase --abort || true
            exit 0
          fi
          echo "rebase_failed=false" >> "$GITHUB_OUTPUT"

      - name: Create conflict issue
        if: steps.rebase.outputs.rebase_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.latest.outputs.tag }}';
            const date = new Date().toISOString().slice(0,10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rebase conflict: langfuse-patch ↔ upstream ${tag} (${date})`,
              body: [
                `自动 rebase \`langfuse-patch\` 到上游 \`${tag}\` 时发生冲突。`,
                '',
                '**处理步骤：**',
                '1. 本地 `git fetch upstream --tags`',
                `2. \`git checkout langfuse-patch\``,
                `3. \`git rebase ${tag}\``,
                '4. 解决冲突（通常只在 wire_gen.go / update_service.go）',
                '5. `git push --force-with-origin langfuse-patch`',
                '',
                '冲突文件列表见 Actions 日志。本 issue 可在修复后关闭。'
              ].join('\n'),
              labels: ['rebase-conflict']
            });

      - name: Force-push rebased branch
        if: steps.rebase.outputs.rebase_failed != 'true' && steps.check.outputs.skip != 'true'
        run: |
          git push --force-with-lease origin ${{ env.PATCH_BRANCH }}
          echo "Pushed rebased langfuse-patch onto ${{ steps.latest.outputs.tag }}"

      # 在 fork 上打与上游相同的 tag 并发 GitHub Release。这样 dashboard
      # 的「检查更新 / 查看更新日志」会指向 fork 自己的 release，而不是回退到上游。
      # Release body 复用上游 changelog + 追加 fork 镜像信息。
      #
      # 触发条件（故意不受 steps.check.skip 约束）：
      #   1. 未发生 rebase 冲突。
      #   2. 找到了上游最新 tag（steps.latest.outputs.skip != 'true'）。
      # 这样即便本次 rebase 被跳过（例如作者本地手动解决完冲突再 force-push
      # 后触发的 workflow_dispatch），只要 fork 上还没有该 tag 的 release，
      # 本步骤仍会补发一次；`gh release view` 检查保证幂等。
      - name: Tag and release on fork
        if: steps.latest.outputs.skip != 'true' && steps.rebase.outputs.rebase_failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest.outputs.tag }}
          UPSTREAM: ${{ env.UPSTREAM }}
        run: |
          set -e
          # 1. fork 上该 tag 的 release 已存在则跳过（避免重复发）
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on fork, skipping"
            exit 0
          fi

          # 2. 拉上游该 tag 的 release body（失败则用占位）
          UPSTREAM_BODY="$(gh api "/repos/${UPSTREAM}/releases/tags/${TAG}" --jq '.body // "" 2>/dev/null || true')"
          if [ -z "$UPSTREAM_BODY" ]; then
            UPSTREAM_BODY="（上游 ${TAG} 暂无 release notes）"
          fi

          # 3. 拼接 fork 镜像信息头 + 上游 changelog
          NOTES_FILE="$(mktemp)"
          {
            echo "> 本 Fork（\`rxho/sub2api-langfuse\`）已自动 rebase 到上游 \`${TAG}\`，并集成 Langfuse LLM Call Trace。"
            echo ">"
            echo "> 🔭 **镜像**：\`ghcr.io/rxho/sub2api:latest\`（匿名可拉）  ·  🛡️ 保留 OAuth TLS 指纹  ·  🔄 每日 CI 自动跟进上游"
            echo ""
            echo "---"
            echo ""
            echo "以下为上游 ${TAG} 的更新日志："
            echo ""
            printf '%s\n' "$UPSTREAM_BODY"
          } > "$NOTES_FILE"

          # 4. 发 release 标记 latest。
          #    gh release create 会在远端 PATCH_BRANCH HEAD 上自动创建对应 tag，
          #    无需本地 git tag + push（避免本地/远端 tag 冲突）。
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${PATCH_BRANCH}" \
            --title "Sub2API ${TAG#v}-langfuse" \
            --notes-file "$NOTES_FILE" \
            --latest
          echo "Created release ${TAG} on fork"
