# 在 langfuse-patch 分支推送时：构建 Docker 镜像并推送到 ghcr.io。
#
# 产出镜像：
#   ghcr.io/<owner>/sub2api:latest           ← 滚动 tag，docker compose pull 拉这个
#   ghcr.io/<owner>/sub2api:<short-sha>      ← 精确版本，可回滚
#
# 镜像内嵌 langfuse 装饰器（随 langfuse-patch 分支源码编译）。
# 升级流程：fork-rebase.yml 自动 rebase → 触发本 workflow → 新镜像 → 机器上 docker compose pull。
name: fork-release

on:
  push:
    branches: [langfuse-patch]
  workflow_dispatch: # 允许手动触发构建

permissions:
  contents: read
  packages: write # 推 ghcr 需要写 packages

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 取版本号需要

      - name: Resolve version
        id: ver
        run: |
          # 版本号保持与上游 tag 完全一致，避免 sub2api 的 parseVersion
          # 把 "-langfuse.xxx" 当成预发布后缀而误判"有新版本可用"。
          # fork 差异信息通过镜像 tag（:v0.1.143-langfuse.<sha>）和 ldflags COMMIT 区分。
          #
          # 为什么不能直接 `git describe --tags`：
          #   CI checkout 只包含 origin（fork）的 tags，不含 upstream 的 v* tag。
          #   fork 上历史遗留的 v0.1.137/v0.1.139 tag 可能指向被 rebase 抛弃的
          #   旧 commit，或是滞后于 HEAD 实际所在的 upstream 版本。
          #   → describe 会挑到过时的 fork tag，导致镜像 tag & 二进制 VERSION
          #     漂移，dashboard 又会红点报"有新版"。
          #
          # 解决：把上游 tags 拉到独立 refs/upstream-tags/ 命名空间（避免
          # 与 fork 同名 tag 撞名 "would clobber"），从高到低找出 HEAD 的
          # 最近 upstream vX.Y.Z 祖先 tag 作为版本号来源。
          git remote add upstream "https://github.com/Wei-Shaw/sub2api.git" 2>/dev/null || true
          git fetch upstream --no-recurse-submodules --prune \
            '+refs/tags/*:refs/upstream-tags/*'

          UPSTREAM_TAG=""
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            commit="$(git rev-parse "${ref}^{commit}" 2>/dev/null || true)"
            [ -z "$commit" ] && continue
            if git merge-base --is-ancestor "$commit" HEAD 2>/dev/null; then
              UPSTREAM_TAG="${ref#refs/upstream-tags/}"
              break
            fi
          done < <(git for-each-ref --sort=-v:refname \
            --format='%(refname)' refs/upstream-tags/ | \
            grep -E 'refs/upstream-tags/v[0-9]+\.[0-9]+\.[0-9]+$')

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::warning::no upstream v* ancestor tag found, falling back to v0.0.0"
            UPSTREAM_TAG="v0.0.0"
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          # 注入到二进制的 version 字段。去掉前导 "v" 以匹配上游 VERSION 文件格式
          # （上游官方镜像同样不带 v）。前端 VersionBadge.vue 会硬编码拼 "v"，
          # 若这里带 v 则显示成 "vv0.1.143"。去掉后前端拼出 "v0.1.143"。
          VERSION="${UPSTREAM_TAG#v}"
          # 镜像 tag 带 fork 标识，便于回溯具体构建
          IMAGE_TAG="${UPSTREAM_TAG}-langfuse.${SHORT_SHA}"
          # 小写 owner（ghcr 镜像名必须小写）
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/sub2api"
          {
            echo "version=${VERSION}"
            echo "image_tag=${IMAGE_TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "image=${IMAGE}"
            echo "owner_lc=${OWNER_LC}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${IMAGE_TAG} (binary version=${VERSION})"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 内置 token，免额外配置

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.short_sha }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.ver.outputs.image }}:latest
            ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Summary
        run: |
          echo "### 镜像已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "镜像 tag：\`${{ steps.ver.outputs.image_tag }}\`（二进制 version=\`${{ steps.ver.outputs.version }}\`）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "拉取：" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.ver.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在 docker-compose.yml 中：\`image: ${{ steps.ver.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
